<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skiftschema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-size: 13px; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #cbd5e1;
        }

        .calendar-day {
            background: white;
            min-height: 110px;
            padding: 4px;
            position: relative;
        }

        .calendar-day:hover {
            background: #f8fafc;
        }

        .calendar-day.other-month {
            background: #f1f5f9;
            opacity: 0.5;
        }

        .calendar-day.today {
            background: #dbeafe;
            border: 2px solid #3b82f6;
        }

        .day-header {
            font-weight: 600;
            font-size: 11px;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
        }

        .shift-bar {
            font-size: 9px;
            padding: 1px 3px;
            margin: 1px 0;
            border-radius: 2px;
            color: white;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            line-height: 1.3;
        }

        .shift-bar:hover {
            opacity: 0.8;
        }

        .shift-color-1 { background-color: #3b82f6; }
        .shift-color-2 { background-color: #8b5cf6; }
        .shift-color-3 { background-color: #ec4899; }
        .shift-color-4 { background-color: #f59e0b; }
        .shift-color-5 { background-color: #10b981; }
        .shift-color-6 { background-color: #06b6d4; }
        .shift-color-7 { background-color: #ef4444; }
        .shift-color-8 { background-color: #6366f1; }

        .day-summary {
            font-size: 9px;
            color: #64748b;
            margin-top: 2px;
            padding-top: 2px;
            border-top: 1px solid #e2e8f0;
        }

        .weekday-header {
            background: #1e293b;
            color: white;
            padding: 6px 4px;
            text-align: center;
            font-weight: 600;
            font-size: 11px;
        }

        .coverage-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .coverage-good { background: #10b981; }
        .coverage-partial { background: #f59e0b; }
        .coverage-poor { background: #ef4444; }

        .compact-card {
            background: white;
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .compact-card h3 {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        input, select {
            font-size: 12px;
        }

        button {
            font-size: 11px;
        }
    </style>
</head>
<body class="bg-slate-100">
    <div class="min-h-screen p-2">
        <div class="max-w-[1600px] mx-auto">
            <!-- Compact Header -->
            <div class="bg-white rounded shadow-sm p-2 mb-2">
                <div class="flex items-center justify-between">
                    <h1 class="text-lg font-bold text-slate-800">📅 Skiftschema</h1>
                    <div class="flex gap-1">
                        <button onclick="previousMonth()" class="px-2 py-1 bg-slate-600 text-white rounded hover:bg-slate-700">←</button>
                        <button onclick="nextMonth()" class="px-2 py-1 bg-slate-600 text-white rounded hover:bg-slate-700">→</button>
                        <button onclick="saveToLocalStorage()" class="px-2 py-1 bg-green-600 text-white rounded hover:bg-green-700">💾</button>
                        <button onclick="loadFromLocalStorage()" class="px-2 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">📂</button>
                        <button onclick="exportSchedule()" class="px-2 py-1 bg-purple-600 text-white rounded hover:bg-purple-700">📥 CSV</button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-6 gap-2">
                <!-- Compact Sidebar -->
                <div class="xl:col-span-1 space-y-2">
                    <!-- KPIs -->
                    <div class="compact-card">
                        <h3>📈 Översikt</h3>
                        <div class="space-y-2 text-xs">
                            <div class="flex justify-between">
                                <span class="text-slate-600">FTE:</span>
                                <span class="font-bold" id="kpiTotalFTE">0</span>/<span id="kpiBudget">44</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-600">Utnyttj:</span>
                                <span class="font-bold text-green-600" id="kpiUtilization">0%</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-600">Kostnad:</span>
                                <span class="font-bold text-purple-600" id="kpiCost">0M</span>
                            </div>
                        </div>
                    </div>

                    <!-- Settings -->
                    <div class="compact-card">
                        <h3>⚙️ Inställningar</h3>
                        <div class="space-y-2">
                            <div>
                                <label class="block text-xs text-slate-600 mb-1">FTE Budget</label>
                                <input type="number" id="totalFTE" value="44" min="1" max="200" onchange="calculate()"
                                       class="w-full px-2 py-1 text-xs border rounded">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-600 mb-1">Kostnad/år (SEK)</label>
                                <input type="number" id="fteCost" value="650000" step="10000" onchange="calculate()"
                                       class="w-full px-2 py-1 text-xs border rounded">
                            </div>
                        </div>
                    </div>

                    <!-- Coverage -->
                    <div class="compact-card">
                        <h3>📊 Täckning (h/dag)</h3>
                        <div class="space-y-1 text-xs">
                            <div class="flex justify-between items-center">
                                <span>Mån-Fre</span>
                                <input type="number" id="coverageMF" value="24" min="0" max="24" onchange="calculate()"
                                       class="w-12 px-1 py-0.5 text-xs border rounded">
                            </div>
                            <div class="flex justify-between items-center">
                                <span>Lördag</span>
                                <input type="number" id="coverageSat" value="12" min="0" max="24" onchange="calculate()"
                                       class="w-12 px-1 py-0.5 text-xs border rounded">
                            </div>
                            <div class="flex justify-between items-center">
                                <span>Söndag</span>
                                <input type="number" id="coverageSun" value="0" min="0" max="24" onchange="calculate()"
                                       class="w-12 px-1 py-0.5 text-xs border rounded">
                            </div>
                        </div>
                    </div>

                    <!-- Presets -->
                    <div class="compact-card">
                        <h3>🏭 Mallar</h3>
                        <select id="rotationPreset" onchange="applyRotationPreset()"
                                class="w-full px-2 py-1 text-xs border rounded">
                            <option value="">Välj mall...</option>
                            <option value="continental">Continental 8h</option>
                            <option value="dupont">DuPont 12h</option>
                            <option value="pitman">Pitman 2-2-3</option>
                            <option value="panama">Panama 2-2-3</option>
                            <option value="24_7_8h">24/7 3-skift</option>
                            <option value="5_8">5x8 Standard</option>
                            <option value="4_10">4x10 Vecka</option>
                        </select>
                    </div>

                    <!-- Shifts -->
                    <div class="compact-card">
                        <h3>🔧 Skift</h3>
                        <div class="space-y-1 mb-2 text-xs" id="shiftsList"></div>
                        <button onclick="showAddShiftModal()" class="w-full px-2 py-1 bg-green-600 text-white rounded hover:bg-green-700">
                            + Lägg till
                        </button>
                    </div>

                    <!-- Quick Analysis -->
                    <div class="compact-card">
                        <h3>💡 Tips</h3>
                        <div id="quickTips" class="text-xs text-slate-600"></div>
                    </div>
                </div>

                <!-- Calendar -->
                <div class="xl:col-span-5">
                    <div class="bg-white rounded shadow-sm p-2 mb-2">
                        <h2 class="text-md font-bold text-center" id="currentMonth"></h2>
                    </div>

                    <div class="bg-white rounded shadow-sm p-1">
                        <div class="calendar-grid" id="calendarGrid">
                            <div class="weekday-header">Mån</div>
                            <div class="weekday-header">Tis</div>
                            <div class="weekday-header">Ons</div>
                            <div class="weekday-header">Tor</div>
                            <div class="weekday-header">Fre</div>
                            <div class="weekday-header">Lör</div>
                            <div class="weekday-header">Sön</div>
                        </div>
                    </div>

                    <!-- Compact Analysis -->
                    <div class="mt-2 grid grid-cols-2 gap-2">
                        <div class="compact-card">
                            <h3>📊 Veckoöversikt</h3>
                            <div id="weeklyAnalysis" class="text-xs"></div>
                        </div>
                        <div class="compact-card">
                            <h3>💰 Skiftkostnader</h3>
                            <div id="costAnalysis" class="text-xs"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Compact Modal -->
    <div id="shiftModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded shadow-xl p-4 max-w-lg w-full m-4 max-h-[90vh] overflow-y-auto">
            <h3 class="text-md font-bold mb-3" id="modalTitle">Lägg till skift</h3>
            <input type="hidden" id="editShiftId" value="">
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium mb-1">Namn</label>
                    <input type="text" id="shiftName" placeholder="t.ex. Morgonpass"
                           class="w-full px-2 py-1 border rounded">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium mb-1">Start (HH:MM)</label>
                        <input type="time" id="shiftStart" value="06:00" step="900"
                               class="w-full px-2 py-1 border rounded" placeholder="06:00">
                    </div>
                    <div>
                        <label class="block font-medium mb-1">Slut (HH:MM)</label>
                        <input type="time" id="shiftEnd" value="14:00" step="900"
                               class="w-full px-2 py-1 border rounded" placeholder="14:00">
                    </div>
                </div>
                <p class="text-xs text-slate-500 -mt-2">24-timmarsformat (t.ex. 06:00, 14:00, 22:00)</p>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block font-medium mb-1">Veckor</label>
                        <input type="number" id="rotationWeeks" value="1" min="1" max="8"
                               class="w-full px-2 py-1 border rounded" onchange="updateRotationUI()">
                    </div>
                    <div>
                        <label class="block font-medium mb-1">Team</label>
                        <input type="number" id="numTeams" value="1" min="1" max="6"
                               class="w-full px-2 py-1 border rounded">
                    </div>
                    <div>
                        <label class="block font-medium mb-1">FTE/team</label>
                        <input type="number" id="shiftFTE" value="5" min="0.5" max="50" step="0.5"
                               class="w-full px-2 py-1 border rounded">
                    </div>
                </div>
                <div id="weekPatternsContainer"></div>
                <div>
                    <label class="block font-medium mb-1">Färg</label>
                    <select id="shiftColor" class="w-full px-2 py-1 border rounded">
                        <option value="1">Blå</option>
                        <option value="2">Lila</option>
                        <option value="3">Rosa</option>
                        <option value="4">Orange</option>
                        <option value="5">Grön</option>
                        <option value="6">Cyan</option>
                        <option value="7">Röd</option>
                        <option value="8">Indigo</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-2 mt-4">
                <button onclick="saveShift()" class="flex-1 px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">
                    Spara
                </button>
                <button onclick="hideShiftModal()" class="px-3 py-1 bg-slate-200 rounded hover:bg-slate-300">
                    Avbryt
                </button>
            </div>
        </div>
    </div>

    <script>
        let shifts = [];
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth();

        const MONTHS = ['Januari', 'Februari', 'Mars', 'April', 'Maj', 'Juni',
                        'Juli', 'Augusti', 'September', 'Oktober', 'November', 'December'];

        const ROTATION_PRESETS = {
            continental: {
                name: 'Continental',
                shifts: [
                    { name: 'Morgon', start: '06:00', end: '14:00', weeks: 1, teams: 4, pattern: [[1,2]], fte: 1 },
                    { name: 'Kväll', start: '14:00', end: '22:00', weeks: 1, teams: 4, pattern: [[1,2]], fte: 1 },
                    { name: 'Natt', start: '22:00', end: '06:00', weeks: 1, teams: 4, pattern: [[1,2]], fte: 1 }
                ]
            },
            dupont: {
                name: 'DuPont',
                shifts: [
                    { name: 'Dag', start: '06:00', end: '18:00', weeks: 4, teams: 4, pattern: [[1,2,3,4],[1,2,3],[1,2,3,4]], fte: 1 },
                    { name: 'Natt', start: '18:00', end: '06:00', weeks: 4, teams: 4, pattern: [[1,2,3,4],[1,2,3],[1,2,3,4]], fte: 1 }
                ]
            },
            pitman: {
                name: 'Pitman',
                shifts: [
                    { name: 'Dag', start: '06:00', end: '18:00', weeks: 2, teams: 4, pattern: [[1,2,5,6,0],[1,2]], fte: 1 },
                    { name: 'Natt', start: '18:00', end: '06:00', weeks: 2, teams: 4, pattern: [[3,4,0],[3,4,5,6,0]], fte: 1 }
                ]
            },
            panama: {
                name: 'Panama',
                shifts: [
                    { name: 'Dag', start: '07:00', end: '19:00', weeks: 2, teams: 4, pattern: [[1,2,5,6,0],[3,4]], fte: 1 },
                    { name: 'Natt', start: '19:00', end: '07:00', weeks: 2, teams: 4, pattern: [[3,4],[1,2,5,6,0]], fte: 1 }
                ]
            },
            '24_7_8h': {
                name: '24/7 Tre Skift',
                shifts: [
                    { name: 'Morgon', start: '06:00', end: '14:00', weeks: 1, teams: 3, pattern: [[1,2,3,4,5]], fte: 2 },
                    { name: 'Kväll', start: '14:00', end: '22:00', weeks: 1, teams: 3, pattern: [[1,2,3,4,5]], fte: 2 },
                    { name: 'Natt', start: '22:00', end: '06:00', weeks: 1, teams: 3, pattern: [[0,1,2,3,4,5,6]], fte: 1.5 }
                ]
            },
            '5_8': {
                name: '5x8',
                shifts: [
                    { name: 'Dagskift', start: '08:00', end: '17:00', weeks: 1, teams: 1, pattern: [[1,2,3,4,5]], fte: 10 }
                ]
            },
            '4_10': {
                name: '4x10',
                shifts: [
                    { name: '4x10', start: '07:00', end: '17:00', weeks: 1, teams: 1, pattern: [[1,2,3,4]], fte: 10 }
                ]
            }
        };

        document.addEventListener('DOMContentLoaded', function() {
            if (!loadFromLocalStorage()) {
                loadExampleShifts();
            }
            renderCalendar();
            renderShiftsList();
            calculate();
        });

        function loadExampleShifts() {
            shifts = [
                { id: 1, name: 'Morgon', startTime: '06:00', endTime: '14:00', rotationWeeks: 1, numTeams: 1, weekPatterns: [[1,2,3,4,5]], fte: 8, color: 1 },
                { id: 2, name: 'Kväll', startTime: '14:00', endTime: '22:00', rotationWeeks: 1, numTeams: 1, weekPatterns: [[1,2,3,4,5]], fte: 8, color: 2 }
            ];
        }

        function applyRotationPreset() {
            const preset = document.getElementById('rotationPreset').value;
            if (!preset) return;

            const pattern = ROTATION_PRESETS[preset];
            if (confirm(`Tillämpa ${pattern.name}? Detta ersätter alla skift.`)) {
                shifts = [];
                let id = 1;
                pattern.shifts.forEach(s => {
                    shifts.push({
                        id: id++,
                        name: s.name,
                        startTime: s.start,
                        endTime: s.end,
                        rotationWeeks: s.weeks,
                        numTeams: s.teams,
                        weekPatterns: s.pattern,
                        fte: s.fte,
                        color: (id % 8) || 1
                    });
                });
                renderShiftsList();
                renderCalendar();
                calculate();
            }
        }

        function previousMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('currentMonth').textContent = `${MONTHS[currentMonth]} ${currentYear}`;

            const grid = document.getElementById('calendarGrid');

            // Remove all day cells (keep headers)
            const days = grid.querySelectorAll('.calendar-day');
            days.forEach(day => day.remove());

            const firstDay = new Date(currentYear, currentMonth, 1);
            let startDate = new Date(firstDay);

            // Get first Monday - JS getDay(): 0=Sun, 1=Mon, ..., 6=Sat
            const firstDayOfWeek = firstDay.getDay();
            const daysToMonday = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;
            startDate.setDate(firstDay.getDate() - daysToMonday);

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Render 6 weeks - append directly to grid
            for (let i = 0; i < 42; i++) {
                const currentDay = new Date(startDate);
                currentDay.setDate(startDate.getDate() + i);

                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';

                const isCurrentMonth = currentDay.getMonth() === currentMonth;
                const isToday = currentDay.getTime() === today.getTime();

                if (!isCurrentMonth) dayDiv.classList.add('other-month');
                if (isToday) dayDiv.classList.add('today');

                // Get day of week: 0=Sun, 1=Mon, ..., 6=Sat (matching our weekPatterns)
                const dayOfWeek = currentDay.getDay();
                const shiftsForDay = getShiftsForDay(currentDay, dayOfWeek);

                const coverage = calculateDayCoverage(shiftsForDay);
                const required = getRequiredCoverage(dayOfWeek);

                let coverageClass = 'coverage-poor';
                if (coverage >= required) coverageClass = 'coverage-good';
                else if (coverage >= required * 0.8) coverageClass = 'coverage-partial';

                const headerDiv = document.createElement('div');
                headerDiv.className = 'day-header';
                headerDiv.innerHTML = `
                    <span>${currentDay.getDate()}</span>
                    <span class="coverage-dot ${coverageClass}" title="Täckning: ${coverage.toFixed(1)}/${required}h"></span>
                `;
                dayDiv.appendChild(headerDiv);

                shiftsForDay.forEach(shift => {
                    const shiftBar = document.createElement('div');
                    shiftBar.className = `shift-bar shift-color-${shift.color}`;
                    shiftBar.textContent = `${shift.name} ${shift.startTime}-${shift.endTime}`;
                    shiftBar.title = `${shift.name}\n${shift.startTime}-${shift.endTime}\n${shift.fte} FTE`;
                    shiftBar.onclick = () => showEditShiftModal(shift.id);
                    dayDiv.appendChild(shiftBar);
                });

                const totalFTE = shiftsForDay.reduce((sum, s) => sum + s.fte, 0);
                if (totalFTE > 0) {
                    const summaryDiv = document.createElement('div');
                    summaryDiv.className = 'day-summary';
                    summaryDiv.innerHTML = `${totalFTE.toFixed(1)} FTE • ${coverage.toFixed(1)}h`;
                    dayDiv.appendChild(summaryDiv);
                }

                grid.appendChild(dayDiv);
            }
        }

        function getShiftsForDay(date, dayOfWeek) {
            const result = [];
            shifts.forEach(shift => {
                for (let team = 0; team < shift.numTeams; team++) {
                    const weekIdx = team % shift.rotationWeeks;
                    const pattern = shift.weekPatterns[weekIdx] || [];
                    if (pattern.includes(dayOfWeek)) {
                        result.push({ ...shift, teamIdx: team });
                    }
                }
            });
            return result;
        }

        function calculateDayCoverage(shiftsForDay) {
            let totalHours = 0;
            shiftsForDay.forEach(shift => {
                const start = timeToHours(shift.startTime);
                const end = timeToHours(shift.endTime);
                const hours = end > start ? (end - start) : (24 - start + end);
                totalHours += hours;
            });
            return totalHours;
        }

        function getRequiredCoverage(dayOfWeek) {
            // 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat
            if (dayOfWeek >= 1 && dayOfWeek <= 5) {
                return parseFloat(document.getElementById('coverageMF').value);
            } else if (dayOfWeek === 6) {
                return parseFloat(document.getElementById('coverageSat').value);
            } else {
                return parseFloat(document.getElementById('coverageSun').value);
            }
        }

        function timeToHours(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours + minutes / 60;
        }

        function updateRotationUI() {
            const numWeeks = parseInt(document.getElementById('rotationWeeks').value);
            const container = document.getElementById('weekPatternsContainer');
            container.innerHTML = '';

            for (let week = 1; week <= numWeeks; week++) {
                const div = document.createElement('div');
                div.className = 'p-2 bg-slate-50 rounded';
                div.innerHTML = `
                    <label class="block font-medium mb-1">Vecka ${week}</label>
                    <div class="flex gap-1 flex-wrap week-days" data-week="${week}">
                        <label class="flex items-center gap-0.5">
                            <input type="checkbox" class="shift-day" value="1"> Mån
                        </label>
                        <label class="flex items-center gap-0.5">
                            <input type="checkbox" class="shift-day" value="2"> Tis
                        </label>
                        <label class="flex items-center gap-0.5">
                            <input type="checkbox" class="shift-day" value="3"> Ons
                        </label>
                        <label class="flex items-center gap-0.5">
                            <input type="checkbox" class="shift-day" value="4"> Tor
                        </label>
                        <label class="flex items-center gap-0.5">
                            <input type="checkbox" class="shift-day" value="5"> Fre
                        </label>
                        <label class="flex items-center gap-0.5">
                            <input type="checkbox" class="shift-day" value="6"> Lör
                        </label>
                        <label class="flex items-center gap-0.5">
                            <input type="checkbox" class="shift-day" value="0"> Sön
                        </label>
                    </div>
                `;
                container.appendChild(div);
            }
        }

        function showAddShiftModal() {
            document.getElementById('modalTitle').textContent = 'Lägg till skift';
            document.getElementById('editShiftId').value = '';
            document.getElementById('shiftName').value = '';
            document.getElementById('shiftStart').value = '06:00';
            document.getElementById('shiftEnd').value = '14:00';
            document.getElementById('shiftFTE').value = '5';
            document.getElementById('shiftColor').value = '1';
            document.getElementById('rotationWeeks').value = '1';
            document.getElementById('numTeams').value = '1';
            updateRotationUI();
            document.getElementById('shiftModal').classList.remove('hidden');
        }

        function showEditShiftModal(id) {
            const shift = shifts.find(s => s.id === id);
            if (!shift) return;

            document.getElementById('modalTitle').textContent = 'Redigera skift';
            document.getElementById('editShiftId').value = id;
            document.getElementById('shiftName').value = shift.name;
            document.getElementById('shiftStart').value = shift.startTime;
            document.getElementById('shiftEnd').value = shift.endTime;
            document.getElementById('shiftFTE').value = shift.fte;
            document.getElementById('shiftColor').value = shift.color;
            document.getElementById('rotationWeeks').value = shift.rotationWeeks;
            document.getElementById('numTeams').value = shift.numTeams;

            updateRotationUI();

            setTimeout(() => {
                shift.weekPatterns.forEach((pattern, weekIdx) => {
                    const weekContainer = document.querySelector(`.week-days[data-week="${weekIdx + 1}"]`);
                    if (weekContainer) {
                        weekContainer.querySelectorAll('.shift-day').forEach(cb => {
                            cb.checked = pattern.includes(parseInt(cb.value));
                        });
                    }
                });
            }, 50);

            document.getElementById('shiftModal').classList.remove('hidden');
        }

        function hideShiftModal() {
            document.getElementById('shiftModal').classList.add('hidden');
        }

        function saveShift() {
            const name = document.getElementById('shiftName').value;
            const start = document.getElementById('shiftStart').value;
            const end = document.getElementById('shiftEnd').value;
            const fte = parseFloat(document.getElementById('shiftFTE').value);
            const color = parseInt(document.getElementById('shiftColor').value);
            const rotationWeeks = parseInt(document.getElementById('rotationWeeks').value);
            const numTeams = parseInt(document.getElementById('numTeams').value);
            const editId = document.getElementById('editShiftId').value;

            const weekPatterns = [];
            document.querySelectorAll('.week-days').forEach(weekContainer => {
                const days = Array.from(weekContainer.querySelectorAll('.shift-day:checked'))
                    .map(cb => parseInt(cb.value));
                weekPatterns.push(days);
            });

            if (!name || weekPatterns.every(p => p.length === 0) || fte <= 0) {
                alert('Fyll i alla fält');
                return;
            }

            if (editId) {
                const shift = shifts.find(s => s.id === parseInt(editId));
                if (shift) {
                    Object.assign(shift, { name, startTime: start, endTime: end, rotationWeeks, numTeams, weekPatterns, fte, color });
                }
            } else {
                shifts.push({ id: Date.now(), name, startTime: start, endTime: end, rotationWeeks, numTeams, weekPatterns, fte, color });
            }

            hideShiftModal();
            renderShiftsList();
            renderCalendar();
            calculate();
        }

        function deleteShift(id) {
            if (confirm('Ta bort skift?')) {
                shifts = shifts.filter(s => s.id !== id);
                renderShiftsList();
                renderCalendar();
                calculate();
            }
        }

        function renderShiftsList() {
            const container = document.getElementById('shiftsList');
            container.innerHTML = '';
            shifts.forEach(shift => {
                const div = document.createElement('div');
                div.className = 'p-1 bg-slate-50 rounded border cursor-pointer hover:bg-slate-100';
                div.onclick = () => showEditShiftModal(shift.id);
                div.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-1">
                            <div class="w-2 h-2 rounded shift-color-${shift.color}"></div>
                            <span>${shift.name}</span>
                        </div>
                        <button onclick="event.stopPropagation(); deleteShift(${shift.id})" class="text-red-500">✕</button>
                    </div>
                    <div class="text-slate-600">${shift.startTime}-${shift.endTime}</div>
                `;
                container.appendChild(div);
            });
        }

        function calculate() {
            const totalFTEBudget = parseFloat(document.getElementById('totalFTE').value);
            const fteCost = parseFloat(document.getElementById('fteCost').value);
            const totalFTEUsed = shifts.reduce((sum, s) => sum + (s.fte * s.numTeams), 0);
            const totalAnnualCost = totalFTEUsed * fteCost;
            const utilization = totalFTEBudget > 0 ? (totalFTEUsed / totalFTEBudget * 100) : 0;

            document.getElementById('kpiTotalFTE').textContent = totalFTEUsed.toFixed(1);
            document.getElementById('kpiBudget').textContent = totalFTEBudget;
            document.getElementById('kpiUtilization').textContent = utilization.toFixed(0) + '%';
            document.getElementById('kpiCost').textContent = (totalAnnualCost / 1000000).toFixed(1) + 'M';

            generateQuickTips();
            generateWeeklyAnalysis();
            generateCostAnalysis();
        }

        function generateQuickTips() {
            const container = document.getElementById('quickTips');
            const totalFTE = shifts.reduce((sum, s) => sum + (s.fte * s.numTeams), 0);
            const budget = parseFloat(document.getElementById('totalFTE').value);

            if (totalFTE > budget) {
                container.innerHTML = '⚠️ Över budget';
            } else if (totalFTE < budget * 0.7) {
                container.innerHTML = '💡 Outnyttjad kapacitet';
            } else {
                container.innerHTML = '✅ Balanserat';
            }
        }

        function generateWeeklyAnalysis() {
            const container = document.getElementById('weeklyAnalysis');
            const days = ['Sön', 'Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör'];
            let html = '<div class="space-y-1">';

            for (let d = 0; d < 7; d++) {
                let coverage = 0;
                shifts.forEach(shift => {
                    shift.weekPatterns.forEach(pattern => {
                        if (pattern.includes(d)) {
                            const start = timeToHours(shift.startTime);
                            const end = timeToHours(shift.endTime);
                            coverage += end > start ? (end - start) : (24 - start + end);
                        }
                    });
                });
                const req = getRequiredCoverage(d);
                const status = coverage >= req ? '✅' : coverage >= req * 0.8 ? '⚠️' : '❌';
                html += `<div class="flex justify-between"><span>${days[d]}</span><span>${coverage.toFixed(1)}/${req}h ${status}</span></div>`;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function generateCostAnalysis() {
            const container = document.getElementById('costAnalysis');
            const fteCost = parseFloat(document.getElementById('fteCost').value);
            let html = '<div class="space-y-1">';

            shifts.forEach(shift => {
                const totalFTE = shift.fte * shift.numTeams;
                const cost = (totalFTE * fteCost / 1000).toFixed(0);
                html += `<div class="flex justify-between"><span>${shift.name}</span><span>${cost}k kr</span></div>`;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        function saveToLocalStorage() {
            const data = {
                shifts,
                totalFTE: document.getElementById('totalFTE').value,
                fteCost: document.getElementById('fteCost').value,
                coverageMF: document.getElementById('coverageMF').value,
                coverageSat: document.getElementById('coverageSat').value,
                coverageSun: document.getElementById('coverageSun').value
            };
            localStorage.setItem('shiftScheduleData', JSON.stringify(data));
            alert('Sparat!');
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('shiftScheduleData');
            if (!saved) return false;
            try {
                const data = JSON.parse(saved);
                shifts = data.shifts || [];
                document.getElementById('totalFTE').value = data.totalFTE || 44;
                document.getElementById('fteCost').value = data.fteCost || 650000;
                document.getElementById('coverageMF').value = data.coverageMF || 24;
                document.getElementById('coverageSat').value = data.coverageSat || 12;
                document.getElementById('coverageSun').value = data.coverageSun || 0;
                renderShiftsList();
                renderCalendar();
                calculate();
                return true;
            } catch (e) {
                return false;
            }
        }

        function exportSchedule() {
            let csv = 'Skiftnamn,Start,Slut,Veckor,Team,FTE/team,Total FTE\n';
            shifts.forEach(shift => {
                csv += `${shift.name},${shift.startTime},${shift.endTime},${shift.rotationWeeks},${shift.numTeams},${shift.fte},${shift.fte * shift.numTeams}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'skiftschema.csv';
            a.click();
        }
    </script>
</body>
</html>
